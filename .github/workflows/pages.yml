# Publish the game to GitHub Pages (mridulsaravanan.com/ruledrift/).
# Only the files the browser needs are published: not tools/ or the docs.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: node tools/selftest.mjs
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html privacy.html terms.html styles.css legal.css manifest.webmanifest sw.js src assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
